<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beats - Home</title>
    <link rel="stylesheet" href="https://use.typekit.net/tft6bms.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="navbar__logo" href="#" aria-label="Beats home">
                <img src="Assets/imgi_2_beats-logo-161616.png" alt="Beats">
            </a>

            <ul class="navbar__links">
                <li><a href="#">Shop</a></li>
                <li>
                    <a class="navbar__gift-link" href="#">
                        Gift Guide
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10h18v11H3zM2 6h20v4H2zM12 6v15M12 6H8.5a2.5 2.5 0 1 1 2.5-2.5V6Zm0 0h3.5A2.5 2.5 0 1 0 13 3.5V6Z"></path>
                        </svg>
                    </a>
                </li>
                <li><a href="#">Support</a></li>
            </ul>

            <div class="navbar__actions">
                <button class="icon-button" type="button" aria-label="Search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6.25"></circle>
                        <path d="m15.2 15.2 5 5"></path>
                    </svg>
                </button>
                <a class="icon-button" href="#" aria-label="Shopping bag">
                    <svg viewBox="0 0 18 20" aria-hidden="true">
                        <path d="M8.68.9c2.2 0 3.95 1.72 3.95 3.82H5.05C5.1 2.6 6.72.9 8.68.9ZM3.1 5.4h11.8c1.8 0 2.5.8 2.5 2.5v9c0 1.7-.8 2.5-2.8 2.5H3.2c-2 0-2.8-.8-2.8-2.5v-9c0-1.7.7-2.5 2.7-2.5Z"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" aria-label="Beats 360 headphones">
            <img class="hero__image" src="Assets/imgi_3_hp-hero-beats-360-kendall.jpg.large.2x.jpg" alt="Kendall Jenner wearing Beats 360 headphones in three different colors">
            <div class="hero__content">
                <p class="hero__eyebrow">Kendall Jenner</p>
                <h1>Beats 360</h1>
                <p class="hero__description">One headphone. Every version of you.<sup>1</sup></p>
                <p class="hero__supporting-text">Choose your color. Make it yours.</p>
                <div class="hero__buttons">
                    <a class="hero__button hero__button--light" href="#">Shop Now</a>
                    <a class="hero__button hero__button--outline" href="#">
                        Customize
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.4-3.4 1.6 1.6 0 0 1 1.1-2.7H18a3 3 0 0 0 3-3c0-5-4-8.9-9-8.9Z"></path>
                            <circle cx="7.5" cy="11" r="1"></circle>
                            <circle cx="10" cy="7.5" r="1"></circle>
                            <circle cx="15" cy="8" r="1"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
